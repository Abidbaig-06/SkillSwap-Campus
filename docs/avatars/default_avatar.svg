<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  <circle cx="64" cy="64" r="60" fill="url(#innerGlow)"/>

  <!-- Minimalist Vector Avatar Silhouette -->
  <g fill="#FFFFFF" fill-opacity="0.95">
    <!-- Head -->
    <circle cx="64" cy="48" r="20"/>
    <!-- Shoulders / Torso -->
    <path d="M 30 102 C 30 82, 45 74, 64 74 C 83 74, 98 82, 98 102 C 98 106, 94 108, 90 108 L 38 108 C 34 108, 30 106, 30 102 Z"/>
  </g>

  <!-- Subtle Inner Border -->
  <circle cx="64" cy="64" r="61" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
</svg>
